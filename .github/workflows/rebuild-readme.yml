name: rebuild readme
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rebuild blog + ops lines
        run: |
          python3 - <<'EOF'
          import re, urllib.request, datetime

          html = urllib.request.urlopen("https://dev.nolanhu.com/blog/", timeout=30).read().decode()
          posts = re.findall(r'<a [^>]*href="(/blog/\d{4}/[^"]+)"[^>]*>([^<]{4,90})', html)[:2]

          readme = open("README.md").read()
          if posts:
              lines = "\n".join(f"- [{t.strip()}](https://dev.nolanhu.com{u})" for u, t in posts)
              block = f"<!--BLOG:START-->\n**`$ tail -2 blog.log`**\n\n{lines}\n<!--BLOG:END-->"
              readme = re.sub(r"<!--BLOG:START-->.*?<!--BLOG:END-->", block, readme, flags=re.S)

          now = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          readme = re.sub(
              r"\$ tail -1 ops\.log\n.*",
              f"$ tail -1 ops.log\n{now} · this README rebuilt itself. no humans were involved.",
              readme,
          )
          open("README.md", "w").write(readme)
          EOF
      - name: commit if changed
        run: |
          git config user.name "ops-bot"
          git config user.email "actions@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "ops: nightly readme rebuild"
          git push
